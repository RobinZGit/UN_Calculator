# Скопируйте этот файл в репозитории в .github/workflows/bump-page-version.yml
# (через веб-интерфейс GitHub или git с токеном с правом workflow), чтобы версия
# поднималась после каждого push в master, если локальный pre-commit не сработал.
name: Bump page version

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: bump-page-version
  cancel-in-progress: true

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[page-version]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bump form version if needed
        run: python3 scripts/bump_form_version.py ci

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No version change"
            exit 0
          fi
          git commit -m "chore: bump page version [page-version]"
          git push
